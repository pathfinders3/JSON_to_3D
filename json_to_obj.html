<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Polyline JSON to OBJ</title>
<style>
  body {
    font-family: sans-serif;
    padding: 20px;
    background: #121212;
    color: #f5f5f5;
  }
  textarea {
    width: 100%;
    height: 360px;
    background: #1e1e1e;
    color: #f5f5f5;
    border: 1px solid #3a3a3a;
  }
  input {
    width: 80px;
    background: #1e1e1e;
    color: #f5f5f5;
    border: 1px solid #3a3a3a;
  }
  button {
    padding: 10px 16px;
    margin-top: 10px;
    background: #2d2d2d;
    color: #ffffff;
    border: 1px solid #4a4a4a;
    cursor: pointer;
  }
  button:hover {
    background: #3a3a3a;
  }
</style>
</head>
<body>

<h2>Polyline JSON → OBJ Converter</h2>

<label>Scale: </label>
<input id="scaleInput" type="number" value="0.1" step="0.01">

<label> Tube sides: </label>
<input id="sidesInput" type="number" value="8" min="3" max="32">

<label> Size multiplier: </label>
<input id="sizeMultiplierInput" type="number" value="1" step="0.1">

<br><br>

<textarea id="jsonInput"></textarea>
<br>

<button onclick="convertAndDownload()">Convert & Download OBJ</button>

<script>
function convertAndDownload() {
  const jsonText = document.getElementById("jsonInput").value;
  const scale = parseFloat(document.getElementById("scaleInput").value);
  const sides = parseInt(document.getElementById("sidesInput").value, 10);
  const sizeMultiplier = parseFloat(document.getElementById("sizeMultiplierInput").value) || 1;

  localStorage.setItem("jsonInput", jsonText);

  let data;
  try {
    data = JSON.parse(jsonText);
  } catch (e) {
    alert("JSON 파싱 오류입니다.");
    return;
  }

  const obj = polylineJsonToObj(data, scale, sides, sizeMultiplier);
  downloadTextFile(obj, "polyline.obj");
}

function polylineJsonToObj(data, scale = 1, sides = 8, sizeMultiplier = 1) {
  let obj = "";
  let vertexIndex = 1;

  obj += "# Polyline JSON converted to OBJ\n";
  obj += "# x, y points converted to Blender mesh tubes\n\n";

  for (const group of data.groups || []) {
    obj += `o ${safeName(group.id)}\n`;

    for (const segment of group.segments || []) {
      const points = segment.points || [];
      if (points.length < 2) continue;

      obj += `g ${safeName(segment.id)}\n`;

      for (let i = 0; i < points.length - 1; i++) {
        const p1 = points[i];
        const p2 = points[i + 1];

        const mesh = createTubeBetweenPoints(p1, p2, scale, sides, sizeMultiplier);

        for (const v of mesh.vertices) {
          obj += `v ${v.x.toFixed(6)} ${v.y.toFixed(6)} ${v.z.toFixed(6)}\n`;
        }

        for (const f of mesh.faces) {
          obj += `f ${f[0] + vertexIndex} ${f[1] + vertexIndex} ${f[2] + vertexIndex} ${f[3] + vertexIndex}\n`;
        }

        vertexIndex += mesh.vertices.length;
        obj += "\n";
      }
    }
  }

  return obj;
}

function createTubeBetweenPoints(p1, p2, scale, sides, sizeMultiplier) {
  const x1 = p1.x * scale;
  const y1 = -p1.y * scale;
  const x2 = p2.x * scale;
  const y2 = -p2.y * scale;

  const z1 = 0;
  const z2 = 0;

  const r1 = (((p1.size || 4) * sizeMultiplier) * scale) / 2;
  const r2 = (((p2.size || 4) * sizeMultiplier) * scale) / 2;

  const dx = x2 - x1;
  const dy = y2 - y1;
  const len = Math.sqrt(dx * dx + dy * dy);

  if (len === 0) {
    return { vertices: [], faces: [] };
  }

  const ux = dx / len;
  const uy = dy / len;

  // XY 평면에서 선에 수직인 방향
  const nx = -uy;
  const ny = ux;

  const vertices = [];
  const faces = [];

  // 시작 링
  for (let i = 0; i < sides; i++) {
    const a = (Math.PI * 2 * i) / sides;
    const c = Math.cos(a);
    const s = Math.sin(a);

    vertices.push({
      x: x1 + nx * c * r1,
      y: y1 + ny * c * r1,
      z: z1 + s * r1
    });
  }

  // 끝 링
  for (let i = 0; i < sides; i++) {
    const a = (Math.PI * 2 * i) / sides;
    const c = Math.cos(a);
    const s = Math.sin(a);

    vertices.push({
      x: x2 + nx * c * r2,
      y: y2 + ny * c * r2,
      z: z2 + s * r2
    });
  }

  // 옆면
  for (let i = 0; i < sides; i++) {
    const next = (i + 1) % sides;
    faces.push([
      i,
      next,
      sides + next,
      sides + i
    ]);
  }

  return { vertices, faces };
}

function safeName(name) {
  return String(name || "object").replace(/[^a-zA-Z0-9_-]/g, "_");
}

function downloadTextFile(text, filename) {
  const blob = new Blob([text], { type: "text/plain" });
  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  a.click();

  URL.revokeObjectURL(url);
}
</script>

</body>
</html>
